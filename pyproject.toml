[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waitless"
version = "1.0.6"
description = "Auto-wait for Selenium in Python: fix flaky tests by waiting for DOM, network, animation and layout stability instead of time.sleep."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Dhiraj Das", email = "dhirajdas.666@gmail.com"}
]
keywords = [
    "selenium",
    "automation",
    "testing",
    "ui-testing",
    "wait",
    "stability",
    "flaky-tests",
    "selenium-python",
    "webdriver",
    "auto-wait",
    "explicit-wait",
    "time-sleep",
    "pytest",
    "test-automation",
    "StaleElementReferenceException",
    "ElementClickInterceptedException"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Acceptance",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "selenium>=4.0",
]

[project.urls]
Homepage = "https://www.dhirajdas.dev/project/waitless"
Documentation = "https://github.com/godhiraj-code/waitless#readme"
Repository = "https://github.com/godhiraj-code/waitless"
Issues = "https://github.com/godhiraj-code/waitless/issues"
Changelog = "https://github.com/godhiraj-code/waitless/blob/main/CHANGELOG.md"
Blog = "https://www.dhirajdas.dev/blog/waitless-v1-end-of-flaky-tests"
X = "https://x.com/dkkkkd"

[project.scripts]
waitless = "waitless.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["waitless*"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
