[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waitless"
version = "1.0.4"
description = "Reduce explicit waits in Selenium by evaluating UI stability signals"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Dhiraj Das", email = "dhirajdas.666@gmail.com"}
]
keywords = [
    "selenium",
    "automation",
    "testing",
    "ui-testing",
    "wait",
    "stability",
    "flaky-tests"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "selenium>=4.0",
]

[project.urls]
Homepage = "https://www.dhirajdas.dev"
Documentation = "https://github.com/godhiraj-code/waitless#readme"
Repository = "https://github.com/godhiraj-code/waitless.git"
Issues = "https://github.com/godhiraj-code/waitless/issues"
Changelog = "https://github.com/godhiraj-code/waitless/blob/main/CHANGELOG.md"

[project.scripts]
waitless = "waitless.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["waitless*"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
